---
apiVersion: v1
kind: Namespace
metadata:
  name: tvheadend
  labels:
    name: tvheadend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dvr-service-config
  namespace: tvheadend
data:
  DVR_CONFIG_NAME: "default"
  LOG_LEVEL: "info"
  GRPC_PORT: "8080"
  HTTP_PORT: "9090"
  METRICS_PORT: "9091"

---
apiVersion: v1
kind: Secret
metadata:
  name: dvr-service-secret
  namespace: tvheadend
type: Opaque
stringData:
  DATABASE_URL: "postgresql://tvheadend:password@postgres:5432/dvr?sslmode=disable"
  NATS_URL: "nats://nats:4222"
  JAEGER_ENDPOINT: "http://jaeger:14268/api/traces"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recordings-pvc
  namespace: tvheadend
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: nfs-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvr-service
  namespace: tvheadend
  labels:
    app: dvr-service
    version: v2.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dvr-service
  template:
    metadata:
      labels:
        app: dvr-service
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: dvr-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: dvr-service
        image: tvheadend/dvr-service:2.0.0
        imagePullPolicy: Always
        ports:
        - name: grpc
          containerPort: 8080
          protocol: TCP
        - name: http
          containerPort: 9090
          protocol: TCP
        - name: metrics
          containerPort: 9091
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dvr-service-secret
              key: DATABASE_URL
        - name: NATS_URL
          valueFrom:
            secretKeyRef:
              name: dvr-service-secret
              key: NATS_URL
        - name: JAEGER_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: dvr-service-secret
              key: JAEGER_ENDPOINT
        envFrom:
        - configMapRef:
            name: dvr-service-config
        volumeMounts:
        - name: recordings
          mountPath: /data/recordings
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: recordings
        persistentVolumeClaim:
          claimName: recordings-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - dvr-service
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: dvr-service
  namespace: tvheadend
  labels:
    app: dvr-service
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 8080
    targetPort: grpc
    protocol: TCP
  - name: http
    port: 9090
    targetPort: http
    protocol: TCP
  selector:
    app: dvr-service

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dvr-service
  namespace: tvheadend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dvr-service
  namespace: tvheadend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dvr-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dvr-service
  namespace: tvheadend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: dvr-service

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dvr-service
  namespace: tvheadend
spec:
  podSelector:
    matchLabels:
      app: dvr-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9091
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 4222
  - to:
    - podSelector:
        matchLabels:
          app: jaeger
    ports:
    - protocol: TCP
      port: 14268
